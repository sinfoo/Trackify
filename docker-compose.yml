# Local stack: PostgreSQL + API + Web. All data fictional; payments simulated only.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintech-dev}
      POSTGRES_DB: fintech
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://fintech:${POSTGRES_PASSWORD:-fintech-dev}@db:5432/fintech
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: { api: { condition: service_healthy } }

volumes:
  pgdata:
